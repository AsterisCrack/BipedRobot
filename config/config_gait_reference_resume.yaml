# RESUME config: continues run BipedV2_SAC_gaitref_2026-10-24_18-55-36 (2026-10-25). Identical to
# config_gait_reference.yaml except: the residual map / spawn are FROZEN to that run's values (not `auto`, so a
# re-bake cannot silently change the action map of the loaded policy), the curricula are collapsed to full
# strength from step 1 (the env step counter restarts at 0 on resume), and the cmd-0 stand fix below
# (foot_flat_l2 -5, stand_pose_l2 -2: the edge stance is ~10x more push-robust in MuJoCo, so -1 / -1 lost to it).
#   python src/isaaclab/train.py --task BipedRobotV2 --config_path config/config_gait_reference_resume.yaml \r
#       --checkpoint checkpoints/BipedV2_SAC_gaitref_2026-10-24_18-55-36/step_479232000.pt --headless
#   (or continue the resume run itself: --checkpoint checkpoints/BipedV2_SAC_gaitref_resume_<time>/step_N.pt; same map)
#
# Gait-table imitation training: BipedRobotV2 + SAC + BAM servo model, residual action map.
# Same settings as config/config.yaml (the newest non-reference config) PLUS the `reference:` block and
# the imitation_* weights below. Synced with config.yaml on 2026-10-18 (residual map, relative tracking
# kernels, posture terms, CAPS, delay / servo-gain DR). Differences kept on purpose are marked "REFERENCE:".
#
# Run (from BipedRobot/, Isaac Lab python). The default --task BipedRobot is the V1 robot:
#   python src/isaaclab/train.py --task BipedRobotV2 --config_path config/config_gait_reference.yaml --headless
#   (optional: --num_envs N, --checkpoint <path> to resume, --video; export_onnx.py takes the same --config_path)
#   Bake the table first if it is missing or stale: cd robot_motion_reference && python -m gait_studio.bake
#   Policies trained before the residual map / this config are incompatible (action map, obs, gait clock).
#
# What the table fixes (do not re-add it here): the gait clock (the TABLE's: a v1 table has one period, a v2 table
# a per-command freq grid, cadence following the command as in humans; held below reference.stand_threshold;
# gait_clock_* keys are ignored when a reference is set), foot clearance, stance width,
# posture and contact timing. The imitation targets are ABSOLUTE joint angles from the table, so the residual
# home below is the table's stand pose (a = 0 is the reference stand); home, scales and spawn height are `auto`
# (derived from the table at train start and frozen into the run's config.yaml, see action_map below).
#
# Watch in TensorBoard:
#   Reward_Terms/imitation_joint_pos, _foot_pos, _contact, _orientation, _lin_vel (should climb fast; RSI starts 80% of
#     resets mid-gait), Diagnostics/swing_clearance_mm (table lifts 10-14 mm), Diagnostics/vel_err_moving_ms
#   Diagnostics/foot_sole_sep_body_m (~0.09 standing, 0.05-0.16 walking; the band term only fires outside that)
#   Reward_Terms/leg_contact_l2 (~0 at flat standing; small dips are table cells with |vy| >= 0.1 whose crossing
#     steps touch the other ankle), Reward_Terms/foot_flat_l2 (~0: table stance tilt is < 3.3 deg)
#   Diagnostics/foot_gap_mm and Diagnostics/foot_overlap_frac (E21; table gap 6-148 mm, stand 33; overlap_frac should fall to ~0,
#     it was ~1.0 at command 0 in run gaitref_2026-10-22_07-18-30), Reward_Terms/foot_proximity
#   Reward_Terms/action_rate_l2 and Curriculum/action_rate_weight (smoothness; CAPS is on)
#   Curriculum/action_delay_max_steps, Curriculum/servo_kp_max, Curriculum/rel_standing_envs, Torque/frac_saturated
#   Standing-still check: a "statue" in the stand pose scores 0.5-0.75 of the imitation budget and 1.8-2.7 of the 3.5
#     tracking budget at cmd 0.05-0.2, so imitation_* stuck near 0.5-0.7 with vel_err_moving_ms high means it is not stepping.

train:
  seed: 42
  steps: 500000
  worker_groups: 1
  workers_per_group: 1
  use_history: True
  history_size: 5
  normalize_obs: True
  symmetry_augmentation: True
  actor_obs: "normal"
  critic_obs: "privileged"
  use_rough_terrain: true
  use_terrain_curriculum: false  # terrain is domain randomization, not a progressive curriculum
  log_dir: "runs"
  checkpoint_path: "checkpoints/"
  model_name: "BipedV2_SAC_gaitref_resume"
  overwrite_model: true
  model: "sac"

  test_environment: False
  epoch_steps: 1000
  save_steps: 3000
  test_episodes: 2
  show_progress: true
  replace_checkpoint: true
  # CAPS action-smoothness regulariser (torch_rl_algorithms SAC actor loss); schema default is off
  caps_temporal_weight: 1.0
  caps_spatial_weight: 1.0
  caps_spatial_sigma: 0.1
  # Explicit actor mirror loss: the gait was asymmetric (one leg lifts, the other drags); symmetry
  # augmentation alone left the actor's mirror error at ~0.6x |a| at 49M steps. 0 = off.
  # Now 0: equivariant_actor below makes the mirror error exactly 0, so the loss would be ~0 anyway.
  symmetry_loss_weight: 0.0
  # Exactly mirror-equivariant actor (loc/scale projected 1/2 (f(s) + M f(M s)), see
  # torch_rl_algorithms/models/equivariant.py). Even with augmentation + the mirror loss the actor stayed
  # ~22% non-equivariant and limped on the same leg from mirrored starts; projecting pi removed the limp.
  # symmetry_augmentation stays on (the critic benefits). The mirror tables are saved in the checkpoint
  # and baked into the ONNX export, so sim2real / policy_gate / Jetson need no change.
  equivariant_actor: true

  env_config:
    reward_scale: 1.0
    reward_weights:
      # Primary locomotion
      track_lin_vel_xy_exp: 2.0
      track_ang_vel_z_exp: 2.0          # was 0.5 — stronger yaw tracking for symmetric turns

      # Stability
      # Softened -5.0 -> -2.0. This term was effectively dead until 2026-09-25 (it compared a
      # one-step-stale IMU copy against a different threshold, so it missed the step that
      # actually terminated). Fixing it made a full-strength -5.0 signal live for the first
      # time, which punishes the falls that walking attempts cause. Restore toward -5.0 once
      # walking is stable again.
      termination_penalty: -0.2
      flat_orientation_l2: -1         # was -1.5 — stronger tilt penalty
      lin_vel_z_l2: -2
      ang_vel_xy_l2: -0.05             # was -0.15 — damp pitch/roll oscillation (flowy body)
      angular_momentum: -0.02
      # upright 0.5 -> 0.2: it was ~95% saturated (raw episode logs) -- a near-constant alive bonus rather than a shaping
      # term; imitation_orientation and flat_orientation_l2 also cover tilt.
      upright: 0.2

      # Smoothness
      # action_rate_l2 is now SCHEDULED (action_rate_weight_* below): this value is only the
      # starting point.
      action_rate_l2: -0.01
      dof_torques_l2: -0.001   # was -0.0001 — 10× to penalise oscillatory PD torques

      dof_pos_limits: -1.0

      # Gait shaping — keep only symmetry/alternation signals, remove energy-encouraging terms
      # Re-enabled at 0.5 (last attempt was 1.2 and destabilised). Three separate defects that
      # made the earlier attempt unwinnable are now fixed: feet indices were INVERTED so it
      # rewarded the wrong stance leg; the phase clock was mirrored with sign +1 when it is
      # antisymmetric; and gait_clock_base_freq demanded a 0.33 m stride (see biped_env_cfg).
      # Standing with both feet down scores 0.5 here, perfect alternation 1.0, so the real
      # incentive to alternate is 0.5*weight per step. Speed-gated, so standing envs are exempt.
      gait_phase_contact: 0.0
      feet_air_time: 0.0               # removed — was encouraging big hops; gait_phase_contact handles timing
      # 0.15 -> 1.5, alongside widening the clearance window to 0.09 in biped_env.
      # Break-even analysis: bending the knee to ~0.6 rad for clearance costs ~0.024/step in
      # joint_deviation_knee + dof_pos_l2, while the clearance reward at weight 0.15 paid only
      # ~0.0075/step. Lifting was a NET LOSS, so the policy correctly refused to do it. Weight
      # must exceed ~0.5 just to break even; 1.5 gives a 3x margin.
      # (The old "was encouraging unnecessary foot lifting" note predates the 4 cm cap.)
      swing_foot_height: 0.0
      # E25: feet_slide OFF (kept in the code, set it back to e.g. -0.7 to restore). It penalised the planar speed of the foot
      # COM frame (robot.data.body_lin_vel_w) of every foot whose soft contact score is > 0: with the table's heel-toe rocker
      # that moves 2-5x faster than the sole slips, so the term fought the reference (MuJoCo, run gaitref_2026-10-22_18-48-09 at
      # vx 0.1 / 0.2 / vy 0.1: 76 / 79 / 79 mm/s measured vs true contact-point slip 17 / 19 / 29 mm/s; on the table itself
      # 16 / 52 / 61 mm/s). Replaced by foot_slip + foot_drag below.
      # E28 (supersedes the E25 note above): feet_slide back ON at -0.7, the 10-22_18-48 setup; foot_slip / foot_drag below are OFF.
      feet_slide: -0.7
      # E25 foot_slip: per loaded foot, the planar speed of the SOLE at the contact (lowest sole corners, rolling excluded), summed
      # over the feet [m/s]. MuJoCo calibration on the 368M policy (sum over feet, mm/s): vx 0.1 22.5, vx 0.2 25.7, vx -0.1 8.2,
      # vy 0.1 33.4, wz 0.6 5.3, stand 0.6 (true force-weighted contact-point slip 16.6 / 18.5 / 6.4 / 29.0 / 4.9 / 0.6);
      # on the gait table kinematics 6.4 / 12.6 / 4.2 / 5.5 / 4.1. -10 => 0.22 / 0.26 / 0.08 / 0.33 / 0.05 per step for the policy,
      # 0.06 / 0.13 / 0.04 / 0.06 / 0.04 for the reference.
      # E28: foot_slip OFF (0.0), back to the 10-22_18-48 setup: at -10 (with foot_drag -5) the two terms cost the policy ~0.37/step, more than
      # joint + foot imitation (~0.24/step), and the reference itself pays a large share, so the gait drifted from the table. The E25 code and
      # Diagnostics/foot_slip_mms stay for logging.
      foot_slip: -4.0
      # E25 foot_drag: scuffing = an UNLOADED foot whose lowest sole corner is below foot_drag_height_m (env_config below) and moving:
      # sum (1 - clearance/h) x sole speed [m/s]. It cannot be ~0 on the reference (the table's own swing start and end pass
      # through < 2 mm at 0.1-0.3 m/s), so it is a small tie-breaker: at -5 and h = 2 mm the policy pays 0.11 / 0.09 / 0.04 / 0.17 /
      # 0.06 per step (vx 0.1 / 0.2 / -0.1, vy 0.1, wz 0.6), the reference 0.05 / 0.12 / 0.08 / 0.07 / 0.02.
      # E28: foot_drag OFF (0.0), same reason as foot_slip above (Diagnostics/foot_drag_mms stays for logging).
      # 2026-10-24: foot_drag back ON at -2 (40% of the E25 -5: ~0.04-0.07/step for the policy, well below imitation).
      foot_drag: -2.0
      step_length: 0.0
      knee_bend_touchdown: 0.0

      # Contact & joint quality
      # Saturates at undesired_contacts_sat_n = 5 N below (was 20 N, with -1.5): -1.0 as in config.yaml.
      undesired_contacts: -1.0
      joint_deviation_hip: 0.0
      joint_deviation_hip_pitch: 0.0   # was -0.05 — slight increase for lean prevention
      joint_deviation_ankle_roll: 0.0
      # Every V2 default joint pos is 0.0 and the knee limit is [-120deg, +5deg], so these
      # deviation terms were literally enforcing a straight leg / flat foot.
      joint_deviation_ankle_pitch: 0.0  # was -0.2 — heel-strike to toe-off needs ankle range
      joint_deviation_knee: 0.0           # was -0.15 — directly penalised the knee bend we want
      torso_centering: 0.0
      # Raised 0.1 -> 0.5 when the term was FIXED (2026-10-03). It used exp(-1.0*dist^2) with
      # dist in metres, which was flat across the whole robot (5 cm off still scored 0.9975),
      # so nothing resisted leaning ahead of the feet. Length scale is com_centering_std below.
      com_support_centering: 0.0
      ankle_torques_l2: 0
      # dof_pos_l2 is L2 (0.5*theta^2) vs joint_deviation_knee's L1 (0.15*|theta|): they match
      # at ~0.3 rad but L2 dominates at the 0.5-0.8 rad bend we want (0.32 vs 0.12 at 0.8).
      # (Zeroed in this file: the imitation terms anchor the pose.)
      dof_acc_l2: -1.0e-06
      # Cut -0.5 -> -0.05. This pulls all 12 joints toward their defaults, and every V2 default
      # is 0.0 -- i.e. a fully straight, zero-abduction leg. Direct evidence it dominates:
      # Diagnostics/foot_sep_body_m decays from 0.07 to 0.0433, which is EXACTLY the URDF hip
      # spacing (2 * 0.021672), meaning the policy drives hip_roll to zero and parks at neutral.
      # An earlier cut to -0.05 was reverted, but that was on broken COM/mass physics.
      dof_pos_l2: 0.0
      # base_height_l2: penalise crouching (<0.29m) and tiptoe (>0.29m)
      base_height_l2: 0 #-5.0
      # foot_separation: two-sided band on the SOLE-CENTRE spacing (foot_separation_mode sole_band below). Weak
      # backstop only: the baked gait keeps 0.05-0.16 m (stand 0.090), so the band is widened below.
      foot_separation: -0.1
      # roll tilt of each foot in contact (sin^2 of the sole normal's lateral component). Table stance tilt < 3.3 deg.
      foot_flat_l2: -5.0   # RESUME: -1 -> -5 (21 deg edge stance ~1.3/step, table stance tilt < 3.3 deg ~0.02). 2026-10-24 back ON (the E22 value; stops standing on the foot edges). penalty: must be <= 0; +1.0 rewarded edge standing in run gaitref_2026-10-19_20-20-42
      # 2026-10-25 edge-stance fix: |sin(sole roll)| per foot in contact, -3. sin^2 (foot_flat_l2) has no gradient near
      # flat, so the policy kept a 5 deg outer-edge stance that tips on the real EVA soles. 5 deg -> ~0.5/step, 21 deg -> ~2.2.
      foot_flat_l1: -3.0
      # legs bracing on each other: non-foot leg links (+ feet on flat terrain), saturates at 5 N
      leg_contact_l2: -0.5
      # E19: non-saturating anchor to the table's stand-frame joints, only while the command is ~0 (run gaitref_2026-10-21_07-17-11 braced: knees on the stop, legs pressing, every other stand term flat)
      stand_pose_l2: -2.0   # RESUME: -1 -> -2
      # E21: terrain-independent foot-to-foot gap (horizontal-plane gap of the two sole rectangles, penalty
      # clamp((margin - gap)/margin, 0, 2)^2, margin below). Run gaitref_2026-10-22_07-18-30 pressed its feet together in 100% of
      # steps at command 0 (13.8 N, MuJoCo -1.2 mm; knees straightened, toes in, ankle pitched) because training uses
      # use_rough_terrain: the contact sensor has no filter prims there, so undesired_contacts / leg_contact_l2 skip the feet.
      foot_proximity: -2.0
      # action_l2 DISABLED: action=0 maps to tiptoe+crouch+lean due to asymmetric joint limits
      action_l2: 0.0

      # Reference tracking (no motion reference loaded)
      track_joint_pos_exp: 0.0
      track_joint_vel_exp: 0.0

      # Gait-table imitation (Gait Studio table, see env_config.reference below). The table now
      # provides foot clearance, stance width, posture and contact timing, so the hand-written
      # gait terms above are zeroed. Velocity tracking and every stability/smoothness term stay.
      # E11 (2026-10-19): the real robot lifted its feet ~0.8 mm (Diagnostics/swing_clearance_mm) against the
      # table's 10-14 mm, so feet slid. Two causes, both fixed here:
      #  * foot height above the GROUND was never imitated (imitation_foot_pos compares foot origins in the base
      #    frame, mean over 6 values, std 0.02: an 11 mm swing-height miss cost ~1% of it) -> new imitation_foot_height.
      #  * a foot DRAGGED with < 1 N load counted as airborne (no height condition): it earned imitation_contact in the
      #    reference swing and escaped feet_slide -> env_config.contact_height_thresh_m below.
      # Budget: at 225M steps the imitation terms were 63% of the positive reward (sum 135 of ~215 per episode) vs
      # track_lin_vel_xy_exp 37.7 + track_ang_vel_z_exp 18.4, so the imitation weights are cut (joint_pos 1.5 -> 0.6,
      # foot_pos 1.0 -> 0.4, orientation 0.5 -> 0.2: it overlaps upright and flat_orientation_l2).
      imitation_joint_pos: 0.6
      imitation_foot_pos: 0.4
      imitation_contact: 0.5
      imitation_orientation: 0.2
      imitation_lin_vel: 0.3
      imitation_ang_vel: 0.2
      imitation_joint_vel: 0.1
      # imitation_foot_height 0.5 -> 1.5: run gaitref_2026-10-20_09-32-16: raw clearance ~5 mm in the first few M steps, ~2 mm from ~7M, ~1.3 mm from 40M,
      # dragged_foot_frac ~0.18 throughout. The wider std keeps the lift-vs-drag gap at ~0.21/step at weight 1.0, so 1.5 raises the
      # total incentive to ~0.31/step; upright 0.5 -> 0.2 frees ~0.28/step of near-constant bonus.
      imitation_foot_height: 1.5       # sole clearance vs the table's foot_height, std reference.std.foot_height (swing_foot_height stays 0)

    # Gait-table imitation. With a table the gait clock runs at the table's rate (v1: one period;
    # v2: freq(cmd), trilinear in the command) and holds while |cmd| < stand_threshold; the deploy
    # runtime must do the same (export_onnx writes gait_clock into deploy_config.json; v2 = bundle v5). Bake: python -m gait_studio.bake in robot_motion_reference/.
    # RSI starts rsi_prob of resets mid-gait on the table (training only; play starts from default).
    reference:
      npz_path: robot_motion_reference/processed/gait_table.npz
      stand_threshold: 0.05
      rsi_prob: 0.8
      rsi_joint_noise: 0.05
      # foot_height 0.010: per-foot kernel exp(-(dh/std)^2); 10 mm off -> 0.37, a 5 mm miss -> 0.78 per swing step.
      # Averaged over the gait cycle a dragging policy still scores ~0.79 (about half the table frames are stance),
      # so the lift-vs-drag gap is ~0.21 per unit weight (0.79 -> 1.0); the contact-height flag (contact_height_thresh_m) does the rest.
      # foot_height 0.004 -> 0.010: at 4 mm the kernel exp(-(dh/std)^2) is ~0 for any lift below ~6 mm (1 mm vs a 10 mm target = 0.006,
      # 3 mm = 0.047), so a dragging policy gets no gradient toward lifting; at 10 mm: 1 mm -> 0.44, 5 mm -> 0.78, 10 mm -> 1.0,
      # over-lift 20 mm -> 0.37 (still discourages high steps).
      std: {joint_pos: 0.15, joint_vel: 1.5, foot_pos: 0.02, orientation: 0.08, lin_vel: 0.1, ang_vel: 0.3, foot_height: 0.010}

    commands:
      base_velocity:
        resampling_time_range: [4.0, 8.0]
        heading_control_stiffness: 0.5
        # Heading mode turns at error*0.5 clamped to this. Without it, ang_vel_z's +-1.2 (sized for
        # turn-in-place) made most moving envs turn at ~1 rad/s for the first seconds of each command.
        heading_max_ang_vel: 0.5
        rel_standing_envs: 0.02      # starting value; scheduled by standing_envs_* below
        rel_heading_envs: 1.0
        # vx = vy = 0 with |wz| in [0.4*max, max]. Uniform sampling makes spin-on-the-spot
        # ~2% of data, so it is otherwise never trained.
        rel_turn_in_place_envs: 0.15
        # "ellipse_xy": (vx/vx_max)^2 + (vy/vy_max)^2 <= 1 (vx_max = forward or backward bound by sign),
        # wz keeps its own box. The combined vx+vy corners are much harder than the axes (the full
        # diagonal is 71% of each axis). "box" = per-axis ranges only. This config is the source of
        # truth for the limit (sampler, tracking, export, Jetson); Gait Studio only mirrors it.
        limit_shape: ellipse_xy
        ranges:
          lin_vel_x: [-0.2, 0.2]       # inside the v2 bake grid (+-0.3)
          lin_vel_y: [-0.15, 0.15]     # inside the bake grid
          ang_vel_z: [-1.2, 1.2]       # inside the bake grid
          heading: [-3.14159, 3.14159]

    # Per-channel observation noise std, in each channel's own units. The previous single
    # scalar (0.05 across all 50 dims) was sized for the IMU and was therefore 0.05 rad =
    # 2.9 deg on joint positions whose real encoder LSB is 0.088 deg — it also noised the
    # command, the previous actions and the gait clock, none of which are sensors.
    observation_noise_std:
      imu_acc: 0.15             # m/s^2
      gyro: 0.02                # rad/s
      projected_gravity: 0.01
      commands: 0.0             # not a sensor
      joint_pos: 0.0015         # rad, ~1 encoder LSB
      joint_vel: 0.25           # rad/s — reference uses +-0.25 vs +-0.001 on joint_pos; refine from
                                # tools/speed_register_check.py once real data exists
      previous_actions: 0.0     # not a sensor
      gait_clock: 0.0           # generated
    # 2026-10-26 hardware traces: walking on the robot carries 3-4x the sim's 3-10 Hz sensor content (gear/structure
    # play): +0.4-0.9 rad/s gyro, +0.5-1.3 m/s^2 accel, +0.3-0.8 rad/s knee/hip joint vel. In MuJoCo that much makes
    # this policy chatter (da 0.13, 18% rate-limited) and fall 1 in 4 -- the hardware failure. Band-limited resonator
    # noise, per-env amplitude U(0,1) x these upper bounds, centre frequency per dim in observation_vibration_hz.
    observation_vibration_std:
      imu_acc: 1.5              # m/s^2
      gyro: 1.0                 # rad/s
      joint_vel: 0.8            # rad/s
    observation_vibration_hz: [3.0, 10.0]
    # Round joint_pos and joint_vel onto the STS3215's 4096-counts/rev grid, so the policy
    # sees the same resolution floor in sim as the servo gives on hardware.
    quantize_joint_obs: true
    action_noise_model:
      mean: 0.0
      std: 0.01

    # Actuator delay, in 50 Hz control steps, drawn per env at reset, ramped 0 -> [0, 1] by the DR curriculum
    # (curriculum_dr_events "action_delay"). 2026-10-24 Jetson trace (servo_bus_manager.py): SYNC_READ, inference and
    # SYNC_WRITE run in the same tick, so sensor sample -> goal on the wire is ~3 ms (+1-3 ms scheduling jitter). The
    # servo's own 5.6 ms command delay is already inside the BAM model (m6 command_delay). So 0 steps is the real robot;
    # 1 step (20 ms) is margin for jitter and the unknown servo return-delay register. The old "+20 ms was what the
    # Jetson had" (2026-10-12) was the write-before-hook order (23 ms late), since fixed.
    action_delay_steps_range: [0, 1]

    # Sensor lag (observation side), in 50 Hz control steps.
    # Encoders are read at the start of the same tick the policy runs in (~0.5-2 ms old), so no delay.
    servo_obs_delay_steps: 0
    # IMU (accel + gyro + projected gravity) lags 0-1 steps, drawn per-env at reset and held for the episode.
    # The reader thread's sample is ~2-6 ms old at inference, plus the BNO055 fusion latency (unmeasured, <~10 ms).
    imu_obs_delay_steps_range: [0, 1]

    # Per-episode CONSTANT sensor biases, drawn uniformly in +-range at each reset. These are
    # deliberately different from observation_noise_std: that resamples every step, so across
    # a 5-frame history stack it largely averages out. A real MPU-6050 has a fixed null offset
    # per power-cycle and each servo's encoder zero carries a fixed assembly error, so the
    # policy has to stay upright with a consistently WRONG reading -- a much harder ask, and the
    # one that actually bites on hardware.
    imu_accel_bias: 0.2        # m/s^2, ~2% of g
    imu_gyro_bias: 0.02        # rad/s, ~1% of walking gyro amplitude
    # Per-ROBOT constants, drawn once at startup (not per episode -- assembly doesn't change):
    # mount_offset_rad is per-servo zero error, applied to the observation AND the command
    # (the servo drives its own offset encoder, so the true joint ends up displaced). It
    # replaces encoder_offset_rad, which was observation-only and redrawn every reset.
    mount_offset_rad: 0.0175   # ~1 deg; STS3215 resolution is 0.088 deg, so this is assembly error
    imu_misalignment_deg: 4.0  # residual IMU board tilt, random axis, angle in [0, 4] deg (was 6; measure it: gravity reading at rest)

    # ---- Servo model (TODO_SIM2REAL.md, Target A) ---------------------------------------
    # params_file is the ONE place the servo identification lives. It is a BAM params JSON;
    # `python -m bam.fit --output <file>` writes exactly this format, so switching to our own
    # fit is a path change. Source: BAM PR #20's 12 V STS3215 fit (actuator/params/).
    #
    # VALIDATED 2026-10-09 against 48 bench recordings of our own servo (actuator/README.md,
    # "Results"): m6 tracks our hardware at 5.5 mrad MAE with torque on, against a 10 mrad
    # published hold-out, and MuJoCo and Isaac reproduce that to 0.06 mrad. m5 scored 0.09
    # mrad better, which is noise, and has three friction terms pinned at ~0. Keep m6.
    # Known gap: with torque OFF the real gearbox holds position and the model lets the
    # joint fall -- stiction is underestimated. Irrelevant to tracking, wrong for impacts.
    actuator:
      params_file: actuator/params/sts3215_12v/m6.json
      kp_fw: 32                     # firmware P register; must match the Jetson's config/robot.yaml
      # Sim-only DR of the firmware P (per robot), ramped from 32 by the DR curriculum ("servo_stiffness"). The stall cap
      # halves the model's small-signal stiffness (17 vs 37 N*m/rad uncapped), and the bench validated the uncapped fit,
      # so the real servo is likely stiffer than the capped model. [32, 50] (was [32, 70]): the most gait-sensitive servo knob in the 2026-10-24 MuJoCo sweep. Verify with an actuator replay. The robot still runs P = kp_fw.
      kp_fw_range: [32, 40]
      vin_range: [11.1, 12.6]       # ASSUMED 3S pack -- set to the real battery's range.
                                    # The SysID bench measured 11.49 V at the servo.
      # 2026-10-10: widened from [0.9, 1.1]. The identified m6 model has a measured
      # 4.4 mrad mean / 14.4 mrad p95 residual against our own hardware on smooth
      # trajectories (actuator/README.md, "Results"); replaying the old +-10% range
      # through the same 48 recordings only spans a 2.0 mrad mean / 5.0 mrad p95 --
      # about half what the real servo actually does. vin_range below already covers
      # it generously on its own (9.8 mrad mean), so this is a modest top-up, not a
      # primary fix for the gap (see the frequency-dependent tail note just below).
      friction_scale_range: [0.8, 1.2]
      torque_scale: 1.0             # TORQUE_LIMIT/1000 on the servos (audit: tools/servo_registers.py)
      # Clamp the duty-limited stall to the DATASHEET. The fit implies 6.33 N*m at 12 V
      # (~2x the datasheet), and a policy trained on it learned a forward lean held by torque
      # the real servo can't sustain. null = trust the params.
      # Our SysID does NOT settle this: the heaviest rig load was 0.433 N*m, ~15% of the
      # datasheet stall, so nothing in that data constrains behaviour near stall. Keeping the
      # cap is the conservative read. Applied by raising R, so no-load speed is unaffected.
      stall_torque_cap_nm: 2.94
      tau_ext_source: observer      # or "gravity" to debug the external-torque estimate
      # 2026-10-25: STS3215 firmware dead zone (CW/CCW_DEADBAND, 0x1A/0x1B) in encoder counts (0.088 deg): no drive
      # while |goal - encoder| <= it. Hardware: the servos ignored the policy's 0.1-0.3 deg standing corrections.
      # Read the real value with BipedRobotJetson/tools/servo_registers.py. Nominal (MuJoCo) / per-servo draw (Isaac).
      deadband_counts: 1
      deadband_counts_range: [1, 1]   # measured 2026-10-25: CW/CCW_DEADBAND = 1 on all 12 servos

    # ---- Backlash (Target B) -----------------------------------------------------------
    # Total gear play per joint, drawn per servo at startup. Isaac uses the lost-motion model
    # in actuator/bam_kernel.py; the MuJoCo eval env uses a fixed value with a real passive hinge.
    # Replace the range with the 12-joint screen's measurements when you have them.
    backlash:
      enabled: true
      lash_deg_range: [1.0, 2.5]    # 2026-10-25 tap test (stand_record, servos holding, pushes): best fit 1.5-2.0 deg per joint
      # 2026-10-25 tap test: with servos holding the home pose, pushes make the robot rock at 2.2-3.0 Hz, zeta
      # 0.02-0.07, +-1.4-2.5 deg, encoders seeing ~55% of it. MuJoCo with the play READ BY the encoder (output side)
      # and 1.5-2.0 deg of play reproduces it (1.5-2.2 Hz, +-1.8-2.9 deg, encoders 82-96%); with the encoder before the
      # play (servo side) the encoders see only 1-8%, so output is the measured side. (An earlier servo-side switch rested
      # on base-velocity kicks that the foot contacts cancel; invalid.)
      encoder_side: output
      mujoco_lash_deg: 1.5
      impulse_cap: 2.94              # N*m cap on the re-engagement knock = the capped stall (clamped to it in bam_actuator)

    # ---- Action map and schedules (Target C) -------------------------------------------
    # residual: target = clamp(home + scale*a, limits). CHANGING THE MAP INVALIDATES EVERY EXISTING CHECKPOINT AND
    # BUNDLE -- export_onnx records it, and the Jetson refuses a mismatch. The home is also the reset pose,
    # the joint_pos_rel origin and the (zeroed here) deviation-reward target.
    # REFERENCE: all three keys are `auto` (utils/residual_home.py), derived at train start from the baked table, so a
    # re-bake in Gait Studio needs no hand-editing here:
    #   action_home_deg  = the table's `stand` frame joint_pos (L = R; per joint type, rounded to 0.1 deg; warns if L != R).
    #   action_scale_rad = per joint type the narrowest 0.05 rad value with max|a| + reference.rsi_joint_noise / scale <=
    #                      scale_headroom (0.96) over every baked cell inside commands.base_velocity.ranges below (both legs,
    #                      table clamped to the joint limits).
    #   spawn_height_m   = Isaac root z that puts the lowest sole point spawn_clearance_m (0.0054) above the floor with the
    #                      robot standing at the home joints (forward kinematics of envs/assets/robotV2/robot_v2.xml). It depends
    #                      on the home only, so it also works for config.yaml's hand-set crouch. Used by non-RSI resets and
    #                      play (MuJoCo's XML root sits 10 mm higher); RSI resets take the base height from the table.
    # train.py FREEZES the numbers: they replace `auto` in the config saved to checkpoints/<run>/config.yaml (and in the env
    # built from it), so export_onnx, policy_gate, sim2real and play read plain numbers and a later re-bake can never change an
    # existing run's map. Write explicit numbers here instead of `auto` to pin the map (config.yaml does).
    # CHANGING THE MAP INVALIDATES EVERY EXISTING CHECKPOINT AND BUNDLE (see above).
    action_map: residual
    action_home_deg: {hip_yaw: 0.7, hip_roll: -2.7, hip_pitch: -8.2, knee: -21.7, ankle_roll: 2.8, ankle_pitch: -13.5}   # RESUME: frozen from run 18-55-36
    action_scale_rad: {hip_yaw: 0.45, hip_roll: 0.45, hip_pitch: 0.75, knee: 0.95, ankle_roll: 0.45, ankle_pitch: 0.45}   # RESUME: frozen
    action_scale_mode: symmetric     # auto scale: symmetric = one scale per joint type; asymmetric = separate +/- scales sized to the gait's max/min (e.g. the knee bends far one way from the stand pose and little the other). Explicit action_scale_rad per type: a number or {pos: x, neg: y}
    spawn_height_m: 0.2861   # RESUME: frozen
    spawn_clearance_m: 0.0054
    scale_headroom: 0.96
    # Gait clock: with a reference it is the table's (its period or freq grid, held below reference.stand_threshold), so
    # gait_clock_mode / gait_clock_period_s / gait_clock_stand_threshold are NOT set here (they would be ignored).
    # Ramps in common_step_counter units (control steps), the same unit as curriculum_dr_*.
    # REFERENCE: 0.10 from step 0 (config.yaml starts at 0.02): the standing reference needs samples from the start.
    standing_envs_start: 0.10
    # 0.25 -> 0.10. Standing is taught by the spawn mix (no stillness reward), but at 0.25
    # a quarter of every batch was commanded to hold still, which (a) costs that much
    # walking experience and (b) silently inflated track_lin_vel_xy_exp ~22%, since a
    # standing env scores ~1.0 on an exp kernel for free. Run C scored 46.6 there against
    # the walking DC run's 38.1 while tracking slightly WORSE once standing envs were
    # stripped out. The DC run used 0.02. Diagnostics/vel_err_moving_ms now reports the
    # honest number so this cannot hide again.
    standing_envs_end: 0.10
    standing_envs_ramp_steps: 30000
    action_rate_weight_start: -0.1   # RESUME: = end, no ramp
    # Same schedule as config.yaml (-0.01 -> -0.1; -0.3 stopped walking before). A perfect imitation of the table costs
    # only ~0.004/step at -0.1 (mean action_rate_l2 0.04), so this does not fight the reference.
    action_rate_weight_end: -0.1
    action_rate_ramp_steps: 30000
    # swing_foot_height pays clearance ABOVE the measured resting foot height (printed at startup)
    # Dead zone REMOVED 2026-10-03. It was 0.01 while the measured peak swing clearance was
    # 0.0063, so clamp(clearance - min, 0) was zero for most swings: the term had no gradient
    # at the operating point and weight 1.5 multiplied nothing. The 0.01 existed to stop an
    # unloaded foot resting flat on the floor from earning reward, and the per-foot touchdown
    # datum (same date) already makes that structurally impossible -- a grounded foot reads
    # clearance 0 by construction. Keeping both was double protection that killed the signal.
    # (swing_foot_height / feet_air_time weights are 0 here, so the swing_* keys are inactive; the table sets clearance.)
    swing_min_clearance: 0.0
    swing_max_clearance: 0.07
    # Reward-side contact flag for imitation_contact and feet_slide: in contact if |F| > 1 N OR the foot is within 2 mm
    # of its own last in-contact height. A foot dragged unloaded no longer counts as airborne. (The sensor, the
    # clearance datum and all other terms stay force-based; Diagnostics/dragged_foot_frac shows the exploit shrinking.)
    # contact_height_thresh_m 0.002 -> 0.004: a foot must clear 4 mm before it counts as airborne for imitation_contact and feet_slide.
    contact_height_thresh_m: 0.006
    # contact_height_thresh_m 0.004 -> 0.006 with contact_height_mode soft: contact score c = max(force_flag, 1 - clearance/6 mm)
    # clamped to [0, 1] (a 3 mm lift counts half, 6 mm = airborne), used by imitation_contact (1 - |c - table|) and as the
    # feet_slide weight. No cliff at the threshold. hard = the old binary flag.
    contact_height_mode: soft
    # imitation_foot_height / imitation_contact: min over the two feet (mean = old). With mean a limp (one foot lifted, one
    # dragged) keeps half the reward; with min the limp-vs-symmetric gap doubles (0.21 -> 0.41 per step at weight 1.0).
    imitation_foot_agg: min
    # com_support_centering now scores the distance the CoM lies OUTSIDE the support
    # POLYGON (0 when inside), not its distance from the support CENTRE. Measuring from the
    # centre taxed the weight transfer that begins every step: shifting onto one foot to
    # unload the other is ~half a stance width off-centre but perfectly stable, and it cost
    # ~0.09/step against a ~0.045/step swing reward. Two rounds of retuning the centre-based
    # form (isotropic 0.04, then anisotropic 0.12/0.04) left foot lift at ~6 mm both times.
    com_centering_std: 0.04
    com_foot_margin: 0.03           # foot half-extent; CoM over a planted foot reads 0
    # Relative velocity-tracking kernels: std = clamp(rel*|cmd|, min). Standing still at |cmd| >= 0.1 earns ~0.13 of the
    # max, half the commanded speed ~0.6. rel 0 = old fixed std (0.2 linear / 0.5 yaw). Same as config.yaml.
    track_lin_std_rel: 0.7
    track_lin_std_min: 0.07
    # reference: the linear kernel is centred on the table's own base velocity at (command, phase) instead of the constant
    # command (width unchanged). The table sways (lateral std ~0.065 m/s, mean = command), so against the command a PERFECT
    # copy scores 0.38 at vx 0.1 (standing 0.13) and 0.28 at vx 0.05 (standing 0.60). Here: 1.0. command = old behaviour.
    track_lin_target: reference
    track_ang_std_rel: 0.7
    track_ang_std_min: 0.1
    # foot_separation: sole_band = two-sided band on the SOLE-CENTRE lateral separation, target +- tol, scale 0.02.
    # REFERENCE: config.yaml uses 0.095 +- 0.025 (70..120 mm). The baked gait stands at 0.090 and keeps 0.088-0.092 for
    # |vy| <= 0.05, but its lateral steps (|vy| >= 0.1) swing the sole centre out to 0.048-0.175 m, so the default band is
    # violated in 43% of table frames (mean penalty 0.63, peak 7.7 x 0.1) and would pull the policy off the reference.
    # 0.105 +- 0.055 = 50..160 mm leaves 0.019 mean (14% of frames, max 0.6): the narrow edge is where the table's own crossing
    # steps start to touch the other ankle. This band is NOT a real guard against touching feet (39 mm sole spacing costs only 0.025/step): foot_flat_l2 guards edge
    # standing and leg_contact_l2 guards ankle/shank/thigh bracing; with use_rough_terrain true the feet themselves are NOT covered by leg_contact_l2 (flat terrain: they are).
    foot_separation_mode: sole_band
    foot_sep_target_m: 0.105
    foot_sep_tol_m: 0.055
    # E21 foot_proximity: footprint half extents [x, y] (centred on foot_sole_offset_m; from the foot collision mesh, test-checked),
    # and the gap below which the penalty starts. 6 mm = the largest whole mm below the gait table's footprint gap over the cells
    # the command ranges above select (the whole 16x12x16 grid, 196,608 poses): min 6.4 mm (vx -0.3, vy -0.018, wz -1.3) /
    # p1 11.4 / p5 17.1 mm (stand 32.8 mm), so the reference is never penalised. Narrower command ranges would allow a larger margin.
    # NOTE (table re-baked 2026-10-23 23:51, style "stable"): that no longer holds. Min footprint gap -7.65 mm (vx +-0.022, vy +-0.15,
    # wz +-1.2), p1 -3.5 / p5 +3.9 / stand 42.8 mm; 344 of 1040 cells dip below 6 mm and 144 overlap, so 6.7% of the table frames (2.4%
    # overlapping) are penalised at this margin. tests/test_foot_proximity.py::test_gait_table_reference_gap_is_not_penalised fails.
    foot_sole_half_extents_m: [0.0450, 0.0186]
    foot_proximity_margin_m: 0.006
    # E25 foot_drag: clearance [m] of the lowest sole corner (above its height at the last loaded step) below which an unloaded, moving
    # foot is penalised. 2 mm (cfg default 5 mm): at 5 mm the reference's own swing costs as much as the policy's (drag 34-73 mm/s on the
    # table vs 29-53 for the policy); at 1-2 mm the policy exceeds the reference at vx 0.1, vy 0.1 and wz 0.6 (by 2-4x).
    foot_drag_height_m: 0.002
    # Optional termination: end the episode (as a fall, termination_penalty applies) after this many seconds of continuous
    # footprint overlap (gap <= 0). 0 = off. 0.25 is the suggested value if the penalty alone does not stop the feet pressing together.
    foot_overlap_termination_s: 0.0
    # undesired_contacts saturates at this force (old: 20 N), so a 6 N lean costs 1.0 not 0.25
    undesired_contacts_sat_n: 5.0

    # Domain randomization master switches. These MUST be set explicitly: the schema defaults
    # are false, and biped_env_cfg.__post_init__ now actually honours them (the gate used to be
    # commented out, so DR ran at full strength while the config claimed it was off).
    # Set either to false to genuinely disable that group — useful for A/B debugging.
    enable_perturbations: true          # push_robot
    enable_physics_randomization: true  # mass / friction / com / payload / joint armature / BAM servo population
    # 2026-10-25: foot-ground friction measured on the robot (tilt test on hardwood): bare plastic ~0.30, duct tape ~0.38
    # (tan 16-17 / 21 deg). The old training range (static 0.6-1.1, dynamic 0.5-1.0) never saw that, and the push
    # falls showed the feet pivoting (yaw 2-9 rad/s). Overrides events.randomize_friction (biped_env_cfg.py).
    events:
      randomize_friction:
        params:
          static_friction_range: [0.25, 0.8]
          dynamic_friction_range: [0.2, 0.7]
    mujoco_ground_friction: 0.35   # MuJoCo gate: the real soles (tape ~0.38, plastic ~0.30)

    # Curriculum — randomize_com and randomize_payload scale from 0→100% over dr_full_steps
    curriculum_enabled: true
    curriculum_dr_start_steps: 0        # start DR from step 0
    curriculum_dr_full_steps:  1     # RESUME: full DR from step 1 (was 10000)   # reach full COM/payload DR (and delay / servo gain) at 10k control steps (~40M env steps)
    curriculum_cmd_ramp_steps:  0       # full command range from the start
    curriculum_init_ramp_steps: 0       # full init range from the start
    # "action_delay" and "servo_stiffness" are ramped in code (BipedEnv._dr_ramp): both at full width from step 0 made
    # walking too hard to discover. They start at 0 delay / P = 32 and reach action_delay_steps_range / kp_fw_range at curriculum_dr_full_steps.
    curriculum_dr_events: ["randomize_com", "randomize_payload", "action_delay", "servo_stiffness"]

model:
  actor_config:
    network_type: mlp
    hidden_sizes: [1024, 512, 256]
  critic_config:
    network_type: mlp
    hidden_sizes: [1024, 512, 256]

  target_coeff: 0.01
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  lr_scheduler:
    scheduler_type: "none"

exploration:
  scale: 0.3
  min_scale: 0.05
  decay_rate: 1.0e-7
  start_steps: 4096
  # Note: SAC temperature (alpha) is now auto-tuned via Lagrangian optimization.
  # The exploration noise above controls the initial random action phase only.

buffer:
  size: 1000000
  return_steps: 5 #1
  batch_iterations: 10 #4
  batch_size: 2048
  discount_factor: 0.99
  steps_before_batches: 4096
  steps_between_batches: 4
  seed: 42
